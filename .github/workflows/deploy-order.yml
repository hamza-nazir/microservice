name: Deploy Order Service

on:
  push:
    branches:
      - main

    paths:
      - "backend/order/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.ORDER_HOST }}
          username: ${{ secrets.ORDER_USER }}
          key: ${{ secrets.ORDER_SSH_KEY }}

          script: |
            cd ~/microservice/backend/order

            git pull origin main

            sudo docker compose down

            docker compose up -d --build